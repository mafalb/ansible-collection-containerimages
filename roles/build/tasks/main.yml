---

- name: Assertions
  ansible.builtin.assert:
    that:
      - date is defined
      - datetime_iso is defined
      - image is defined
      - flavor is defined
      - base_image

- name: Build image
  environment:
    OS: "{{ os }}"
    ANSIBLE_COLLECTIONS_PATHS: "../../.."
  ansible.builtin.command:  # noqa no-changed-when inline-env-var
    chdir: "{{ role_path }}/../.."
    cmd: ansible-bender build -l org.label-schema.build-date={{ date }} org.opencontainers.image.created={{ datetime_iso }} --squash {{ role_path }}/../playbooks/{{ flavor }}.yml {{ base_image }} {{ target_image }}
